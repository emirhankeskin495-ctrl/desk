name: crypto-desk
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: desk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python crypto_desk.py --once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACCOUNT_USDT: ${{ secrets.ACCOUNT_USDT }}
      - name: Kaydet
        continue-on-error: true
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add cooldown.json history.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "signals"
            git pull --rebase origin main || git rebase --abort
            git push || echo "push basarisiz, bu tur durum kaydedilmedi"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pages tekrar dene
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
